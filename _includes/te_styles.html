<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #efefea;
    color: #111;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(12px, calc(12px + (14 - 12) * ((100vw - 320px) / (900 - 320))), 14px);
    line-height: 1.45;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }

  .te {
    --orange: #e85500;
    --gray: #d8d8d2;
    --muted: #666;
    --rule: #ccc;
    max-width: 720px;
    margin: 0 auto;
    padding: 3.5em 1.5em 6em;
  }

  .te a {
    color: var(--orange);
    text-decoration: none;
  }
  .te a:hover { text-decoration: underline; }
  .te a:visited { color: var(--orange); }

    outline: 2px solid var(--orange);
    outline-offset: 4px;
    text-decoration: none;
  }

  a.te-mark {
    display: block;
    width: 32px;
    height: 32px;
    background: #111;
    margin-bottom: 1.4em;
  }
  a.te-mark:hover { opacity: 0.8; text-decoration: none; }

  .te-header {
    margin-bottom: 3.5em;
    padding-bottom: 2em;
    border-bottom: 1px solid var(--rule);
  }
  .te-header.compact {
    margin-bottom: 2.5em;
    padding-bottom: 1.5em;
  }
  .te-mark-static {
    width: 32px;
    height: 32px;
    background: #111;
    margin-bottom: 1.4em;
  }
  .te-name {
    font-size: clamp(1.6rem, 5vw, 2.2rem);

    letter-spacing: -0.03em;

    text-transform: lowercase;
    margin-bottom: 0.35em;

  .te-section-label {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.2em;

  .te-post-header {

    padding-bottom: 1.8em;
    border-bottom: 1px solid var(--rule);

    margin-bottom: 0.3em;

    text-transform: lowercase;
    margin-bottom: 0.8em;

    padding: 1.1em 0;
    border-bottom: 1px solid var(--rule);

    height: 64px;

    align-items: center;
    justify-content: center;
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    color: #888;
    text-transform: uppercase;
    flex-shrink: 0;

  .te-thumb.dark {
    background: #111;
    color: #efefea;
  }

  .te-row-body { min-width: 0; }

  .te-code {
    font-size: 0.95rem;
    letter-spacing: -0.02em;
    margin-bottom: 0.25em;
  }
  .te-code em {
    font-style: normal;
    font-weight: 400;
  }

  .te-desc {
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.5;
    margin-bottom: 0.4em;
  }

  .te-action {
    color: var(--orange);
    font-size: 0.88rem;
    text-transform: lowercase;
  }

    margin-top: 0.6em;

  .te-specs li {
    font-size: 0.82rem;
    color: #333;
    padding: 0.2em 0;
    line-height: 1.45;

  .te-spec-table {
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    color: #333;
    margin-top: 0.8em;

    text-transform: lowercase;

    display: inline;
    margin: 0;
  }
  .te-spec-table .te-spec-line {
    display: block;
    margin-bottom: 0.15em;
  }

  .te-log {
    border-top: 1px solid var(--rule);
  }

  .te-explore {
    margin-top: 1.5em;
    font-size: 0.88rem;
    text-transform: lowercase;
  }

  .te-footer {
    margin-top: 4em;
    padding-top: 2em;
    border-top: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--muted);
    text-transform: lowercase;
    line-height: 1.8;
  }
  .te-footer a { margin-right: 0.3em; }

  .te-quote {
    margin: 2em 0 0;
    padding: 1.2em 0 0;
    border-top: 1px solid var(--rule);
    font-size: 0.78rem;
    color: var(--muted);
    font-style: italic;
    text-transform: lowercase;
  }

    max-width: 960px;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .te-landing-hero {
    margin-bottom: 2.75em;
    padding-bottom: 1.5em;
    min-width: 0;
  }
  .te-kicker {
    margin-bottom: 0.85em;
    font-family: "SF Mono", Monaco, "Courier New", monospace;

    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);

    color: #fff !important;

    align-items: end;
    margin-bottom: 1.25em;

    margin-bottom: 0.55em;

  .te-section-heading > p {
    max-width: 360px;
    justify-self: end;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.45;
  }
  .te-section-title {
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.15;
    overflow-wrap: break-word;
  }
  .te-featured-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .te-featured {
    display: flex;
    min-width: 0;
    min-height: 220px;
    padding: 1.15em 1.2em;
    flex-direction: column;
    color: inherit !important;
    border-right: 1px solid var(--rule);
  }
  .te-featured:last-child {
    border-right: 0;
  }
  .te-featured:hover {
    background: rgba(0, 0, 0, 0.025);
    text-decoration: none !important;
  }
  .te-featured-primary {
    background: rgba(0, 0, 0, 0.035);
  }
  .te-featured-primary:hover {
    background: rgba(0, 0, 0, 0.055);
  }
  .te-featured-primary .te-featured-meta {
    color: var(--orange);
  }
  .te-featured-meta,
  .te-article-meta {
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .te-featured strong {
    margin: 1.5em 0 0.7em;
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.2;
    overflow-wrap: break-word;
  }
  .te-featured > span:not(.te-featured-meta) {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.5;
  }
  .te-featured em {
    margin-top: auto;
    padding-top: 2em;
    color: var(--orange);
    font-size: 0.78rem;
    font-style: normal;
  }
  .te-article-row {
    grid-template-columns: 48px 1fr;
    align-items: center;
  }
  .te-article-row .te-thumb {
    width: 48px;
    height: 48px;
  }
  .te-article-row .te-code {
    margin-bottom: 0.35em;
    color: #111;
    font-size: 1rem;
  }
  .te-about {
    padding: 2em;
    background: #111;
    color: #efefea;
  }
  .te-about .te-section-label,
  .te-about .te-spec-table dt {
    color: #aaa;
  }
  .te-about-grid {
    display: grid;
    grid-template-columns: minmax(180px, 0.8fr) minmax(0, 1.2fr);
    gap: 3em;
  }
  .te-about-copy {
    color: #d2d2cc;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .te-about-copy p + p {
    margin-top: 1em;
  }
  .te-about .te-spec-table {
    color: #efefea;
  }
  .te-newsletter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .te-newsletter {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 1em;
    padding: 1.2em;
    color: inherit !important;
  }
  .te-newsletter:first-child {
    border-right: 1px solid var(--rule);
  }
  .te-newsletter:hover {
    background: rgba(0, 0, 0, 0.025);
    text-decoration: none !important;
  }
  .te-newsletter .te-thumb {
    grid-row: span 2;
    width: 48px;
    height: 48px;
  }
  .te-newsletter strong,
  .te-newsletter small {
    display: block;
  }
  .te-newsletter strong {
    margin-bottom: 0.25em;
    font-weight: 500;
  }
  .te-newsletter small {
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.4;
  }
  .te-newsletter em {
    grid-column: 2;
    color: var(--orange);
    font-size: 0.78rem;
    font-style: normal;
  }
  .te-landing .te-footer {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4em 1.1em;
  }
  .te-landing .te-footer span {
    margin-right: auto;
    color: #111;
  }

    line-height: 1.65;
    color: #222;
  }
  .te-prose > *:first-child { margin-top: 0; }
  .te-prose > *:last-child { margin-bottom: 0; }

  .te-prose p {
    margin: 0 0 1.1em;
  }
  .te-prose h2, .te-prose h3, .te-prose h4 {
    font-weight: 400;
    letter-spacing: -0.02em;
    text-transform: lowercase;
    margin: 2em 0 0.6em;
    line-height: 1.25;
  }
  .te-prose h2 { font-size: 1.15rem; }
  .te-prose h3 { font-size: 1.05rem; }
  .te-prose h4 { font-size: 0.95rem; color: var(--muted); }

  .te-prose a {
    color: var(--orange);
    text-decoration: underline;
    text-underline-offset: 0.12em;
  }
  .te-prose a:hover { color: #111; }

  .te-prose blockquote {
    margin: 1.4em 0;
    padding: 0 0 0 1.2em;
    border-left: 2px solid var(--rule);
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.6;
  }
  .te-prose blockquote p { margin-bottom: 0.6em; }
  .te-prose blockquote p:last-child { margin-bottom: 0; }

  .te-prose ul, .te-prose ol {
    margin: 0 0 1.1em 1.4em;
    padding: 0;
  }
  .te-prose li {
    margin-bottom: 0.35em;
  }

  .te-prose img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1.5em 0;
  }

  .te-prose pre {
    margin: 1.4em 0;
    padding: 1em 1.1em;
    background: #e4e4de;
    border: 1px solid var(--rule);
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .te-prose code {
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 0.88em;
    background: #e4e4de;
    padding: 0.1em 0.35em;
  }
  .te-prose pre code {
    background: none;
    padding: 0;
    font-size: inherit;
  }

  .te-prose table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.4em 0;
    font-size: 0.85rem;
  }
  .te-prose th, .te-prose td {
    border: 1px solid var(--rule);
    padding: 0.5em 0.7em;
    text-align: left;
  }
  .te-prose th {
    font-weight: 400;
    color: var(--muted);
    text-transform: lowercase;
  }

  .te-prose hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2em 0;
  }

      max-width: 100%;

    .te-landing-hero { margin-bottom: 2.25em; padding-bottom: 1.25em; }
    .te-landing .te-name { font-size: clamp(1.75rem, 8.2vw, 2.05rem); }
    .te-lede { font-size: 1rem; }

    .te-hero-primary { box-sizing: border-box; }
    .te-section-heading,
    .te-about-grid {
      grid-template-columns: minmax(0, 1fr);
      gap: 0.7em;
    }
    .te-section-heading > p {
      justify-self: start;
      max-width: none;
    }
    .te-featured-grid,
    .te-newsletter-grid {
      grid-template-columns: minmax(0, 1fr);

      min-height: 0;
      border-right: 0;
      border-bottom: 1px solid var(--rule);
    }
    .te-featured:last-child {
      border-bottom: 0;
    }

      padding: 1.5em;
    }
    .te-about-grid {
      min-width: 0;
    }
    .te-newsletter {
      min-width: 0;
      grid-template-columns: 48px minmax(0, 1fr);
    }
    .te-newsletter:first-child {
      border-right: 0;
      border-bottom: 1px solid var(--rule);
    }
    .te-landing .te-footer {
      max-width: 100%;
    }
    .te-landing .te-footer span {
      width: 100%;
      margin-bottom: 0.5em;
    }

      grid-template-columns: 48px minmax(0, 1fr);
    }

  @media (max-width: 480px) {
    .te { padding: 2.5em 1em 5em; }
    .te-row { grid-template-columns: 48px minmax(0, 1fr); gap: 0.8em 1em; }
    .te-thumb { width: 48px; height: 48px; font-size: 0.58rem; }
    .te-featured-meta { letter-spacing: 0.02em; }
    .te-kicker { letter-spacing: 0.06em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .te-landing .te-row {
      transition: none;

  }
