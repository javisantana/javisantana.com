name: Tinybird CI

on:
  workflow_dispatch:
  push:
    branches: [ gh-pages ]
  pull_request:
    branches: [ gh-pages ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      tinybird:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 80:80
        credentials:
          username: tinybirdclickhouserobot
          password: ${{ secrets.docker_hub_password }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Tinybird CLI
        run: curl -LsSf https://tinybird.co | sh

      - name: build the project
        run: cd tinybird_stats && tb build
