<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>javi santana</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #efefea;
      color: #111;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(12px, calc(12px + (14 - 12) * ((100vw - 320px) / (900 - 320))), 14px);
      line-height: 1.45;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .te {
      --orange: #e85500;
      --gray: #d8d8d2;
      --muted: #666;
      --rule: #ccc;
      max-width: 720px;
      margin: 0 auto;
      padding: 3.5em 1.5em 6em;
    }

    .te a {
      color: var(--orange);
      text-decoration: none;
    }
    .te a:hover { text-decoration: underline; }
    .te a:visited { color: var(--orange); }

    .te-header {
      margin-bottom: 3.5em;
      padding-bottom: 2em;
      border-bottom: 1px solid var(--rule);
    }
    .te-mark {
      width: 32px;
      height: 32px;
      background: #111;
      margin-bottom: 1.4em;
    }
    .te-name {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-transform: lowercase;
      margin-bottom: 0.35em;
    }
    .te-sub {
      color: var(--muted);
      font-size: 0.92rem;
      text-transform: lowercase;
    }

    .te-section {
      margin-bottom: 3em;
    }
    .te-section-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2em;
    }

    .te-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 1em 1.2em;
      align-items: start;
      padding: 1.1em 0;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
    }
    a.te-row:hover {
      background: rgba(0, 0, 0, 0.02);
      text-decoration: none;
    }
    .te-row:last-child { border-bottom: none; }

    .te-thumb {
      width: 64px;
      height: 64px;
      background: var(--gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "SF Mono", Monaco, "Courier New", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: #888;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .te-thumb.dark {
      background: #111;
      color: #efefea;
    }

    .te-row-body { min-width: 0; }

    .te-code {
      font-size: 0.95rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.25em;
    }
    .te-code em {
      font-style: normal;
      font-weight: 400;
    }

    .te-desc {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 0.4em;
    }

    .te-action {
      color: var(--orange);
      font-size: 0.88rem;
      text-transform: lowercase;
    }

    .te-specs {
      list-style: none;
      margin-top: 0.6em;
    }
    .te-specs li {
      font-size: 0.82rem;
      color: #333;
      padding: 0.2em 0;
      line-height: 1.45;
    }

    .te-spec-table {
      font-family: "SF Mono", Monaco, "Courier New", monospace;
      font-size: 0.72rem;
      line-height: 1.7;
      color: #333;
      margin-top: 0.8em;
    }
    .te-spec-table dt {
      display: inline;
      color: var(--muted);
      text-transform: lowercase;
    }
    .te-spec-table dt::after { content: ' '; }
    .te-spec-table dd {
      display: inline;
      margin: 0;
    }
    .te-spec-table .te-spec-line {
      display: block;
      margin-bottom: 0.15em;
    }

    .te-log {
      border-top: 1px solid var(--rule);
    }

    .te-explore {
      margin-top: 1.5em;
      font-size: 0.88rem;
      text-transform: lowercase;
    }

    .te-footer {
      margin-top: 4em;
      padding-top: 2em;
      border-top: 1px solid var(--rule);
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: lowercase;
      line-height: 1.8;
    }
    .te-footer a { margin-right: 0.3em; }

    .te-quote {
      margin: 2em 0 0;
      padding: 1.2em 0 0;
      border-top: 1px solid var(--rule);
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      text-transform: lowercase;
    }

    @media (max-width: 480px) {
      .te { padding: 2.5em 1em 5em; }
      .te-row { grid-template-columns: 48px 1fr; gap: 0.8em 1em; }
      .te-thumb { width: 48px; height: 48px; font-size: 0.58rem; }
    }
  </style>
</head>
<body>
  {{ content }}
  {% include tracker.html %}
</body>
</html>
