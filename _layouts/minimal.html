<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description | strip_html | escape }}">{% endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">
  <link rel="stylesheet" href="{{ site.baseurl }}/min.css">
</head>
<body>
  {{ content }}
  {% include tracker.html %}
</body>
</html>
