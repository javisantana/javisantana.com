destination: a
highlighter: rouge
markdown: kramdown
name: javisantana.com
description: Pixels are the humble bricks with which one can build cathedrals
url: http://javisantana.com

# Modern Jekyll plugins
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination settings
paginate: 5
paginate_path: "/blog/page:num/"

# Prose.io configuration
prose:
  metadata:
    _posts:
      - name: "layout"
        field:
          element: "hidden"
          value: "blog3"

# Sass configuration
sass:
  style: :compressed

# Default layouts
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: "studio"
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: "micro-book-template"
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Collections
collections:
  inspiration:
    output: true
  fastdata:
    output: true

# SEO and feed settings
author:
  name: "Javi Santana"
  email: "javisantana@gmail.com"
  bio: "Data Engineer and Developer"
  location: "Madrid, Spain"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/javisantana"

# Feed settings
feed:
  path: feed.xml
  limit: 10

# Sitemap settings
sitemap:
  changefreq: weekly
  priority: 0.5
